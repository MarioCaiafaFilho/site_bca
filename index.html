
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Gestor BCA | Login</title>

  <style>
    :root {
      --azul: #123b60;
      --azul-escuro: #092b49;
      --azul-claro: #eaf2f8;
      --fundo: #f3f6f9;
      --texto: #203040;
      --cinza: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--texto);
      background: var(--fundo);
    }

    .pagina {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    .apresentacao {
      background: linear-gradient(
        145deg,
        var(--azul),
        var(--azul-escuro)
      );
      color: white;
      padding: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .marca {
      font-size: 64px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 18px;
    }

    .apresentacao h1 {
      font-size: 30px;
      margin: 0 0 14px;
    }

    .apresentacao p {
      font-size: 17px;
      line-height: 1.7;
      max-width: 420px;
      color: #dce8f2;
    }

    .login-area {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .login-box {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 42px 36px;
      width: 100%;
      max-width: 410px;
      box-shadow: 0 12px 35px rgba(0,0,0,.05);
    }

    .login-box h2 {
      font-size: 25px;
      margin: 0 0 12px;
      color: var(--azul);
    }

    .subtitulo {
      color: var(--cinza);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .botao-google {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      background: white;
      color: var(--texto);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
    }

    .botao-google:hover:not(:disabled) {
      background: var(--azul-claro);
      border-color: var(--azul);
    }

    .botao-google:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .icone-google {
      font-size: 20px;
      font-weight: bold;
      color: #4285f4;
    }

    .mensagem {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--cinza);
      overflow-wrap: anywhere;
    }

    .sair {
      margin-top: 18px;
      border: none;
      background: transparent;
      color: var(--azul);
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px;
    }

    .oculto {
      display: none;
    }

    .rodape {
      margin-top: 35px;
      text-align: center;
      font-size: 12px;
      color: var(--cinza);
    }

    @media (max-width: 800px) {
      .pagina {
        grid-template-columns: 1fr;
      }

      .apresentacao {
        min-height: 220px;
        padding: 35px 24px;
      }

      .marca {
        font-size: 42px;
      }

      .apresentacao h1 {
        font-size: 22px;
      }

      .apresentacao p {
        font-size: 14px;
      }

      .login-area {
        padding: 28px 18px;
      }

      .login-box {
        padding: 30px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="pagina">

    <section class="apresentacao">
      <div class="marca">BCA</div>

      <h1>Gestor BCA</h1>

      <p>
        Um ambiente para organizar atividades,
        acompanhar prazos e gerenciar as rotinas
        do escritório com praticidade e segurança.
      </p>
    </section>

    <section class="login-area">
      <div class="login-box">

        <h2>Bem-vindo!</h2>

        <p class="subtitulo">
          Entre com sua conta Google para
          acessar o Gestor BCA.
        </p>

        <button
          id="botaoEntrar"
          class="botao-google"
          type="button"
          disabled
        >
          <span class="icone-google">G</span>
          Entrar com Google
        </button>

        <p
          id="mensagem"
          class="mensagem"
          role="status"
          aria-live="polite"
        >
          Preparando autenticação...
        </p>

        <button
          id="botaoSair"
          class="sair oculto"
          type="button"
        >
          Sair da conta
        </button>

        <div class="rodape">
          Gestor BCA — Acesso restrito
        </div>

      </div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <script>
    // CONFIGURAÇÃO PÚBLICA DO SUPABASE

    const SUPABASE_URL =
      "https://pdvipfzbtpsuenpumktb.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_IOUb057J98PySmHjKai1Eg_mR4rSIjB";

    // URL oficial do sistema, já cadastrada no Supabase.
    const SITE_URL =
      "https://mariocaiafafilho.github.io/gestor-bca-web/";

    const botaoEntrar =
      document.getElementById("botaoEntrar");

    const botaoSair =
      document.getElementById("botaoSair");

    const mensagem =
      document.getElementById("mensagem");

    function mostrarMensagem(texto) {
      mensagem.textContent = texto;
    }

    function mostrarDesconectado() {
      botaoEntrar.classList.remove("oculto");
      botaoSair.classList.add("oculto");
      botaoEntrar.disabled = false;

      mostrarMensagem(
        "Entre com sua conta Google. " +
        "O acesso aos módulos dependerá de autorização."
      );
    }

    function mostrarAutenticado(usuario) {
      botaoEntrar.classList.add("oculto");
      botaoSair.classList.remove("oculto");

      mostrarMensagem(
        "Conta Google autenticada: " +
        (usuario.email || "E-mail não disponível") +
        ". O acesso ao sistema ainda está sendo configurado."
      );
    }

    if (
      SUPABASE_PUBLIC_KEY ===
      "COLE_AQUI_SUA_CHAVE_PUBLISHABLE"
    ) {
      mostrarMensagem(
        "Configure a chave pública do Supabase " +
        "no arquivo index.html."
      );
    } else if (!window.supabase) {
      mostrarMensagem(
        "Não foi possível carregar a biblioteca do Supabase."
      );
    } else {
      const cliente = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY
      );

      botaoEntrar.addEventListener("click", async () => {
        botaoEntrar.disabled = true;
        mostrarMensagem("Abrindo login Google...");

        const { error } =
          await cliente.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: SITE_URL
            }
          });

        if (error) {
          mostrarMensagem(
            "Não foi possível iniciar o login: " +
            error.message
          );

          botaoEntrar.disabled = false;
        }
      });

      botaoSair.addEventListener("click", async () => {
        const { error } = await cliente.auth.signOut();

        if (error) {
          mostrarMensagem(
            "Não foi possível sair: " + error.message
          );
          return;
        }

        mostrarDesconectado();
      });

      async function verificarSessao() {
        const { data, error } =
          await cliente.auth.getUser();

        if (error || !data.user) {
          mostrarDesconectado();
          return;
        }

        mostrarAutenticado(data.user);
      }

      cliente.auth.onAuthStateChange(
        (_evento, sessao) => {
          if (!sessao) {
            mostrarDesconectado();
          } else {
            mostrarAutenticado(sessao.user);
          }
        }
      );

      verificarSessao();
    }
  </script>

</body>
</html>
